
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-ocr"
version = "0.1.0"
description = "AI-powered receipt information extraction using Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "google-genai",
    "python-dotenv",
    "Pillow",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
receipt-ocr = "receipt_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
